name: Bamboo motion apply

on:
  push:
    branches:
      - agent/bamboo-character-motion-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bamboo-character-motion-v2
      - name: Apply fighter motion wiring
        run: |
          echo 'CmZyb20gcGF0aGxpYiBpbXBvcnQgUGF0aApwYXRoID0gUGF0aCgiYXBwcy9zdGFnZS9zcmMvQmFtYm9vQmF0dGxlM0QudHN4IikK ' | tr -d ' ' | base64 -d | python
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/stage/src/BambooBattle3D.tsx apps/stage/src/bambooMotion.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Improve Bamboo fighter motion state'
          git push origin HEAD:agent/bamboo-character-motion-v2
