name: Bamboo motion refactor

on:
  push:
    branches: [agent/bamboo-character-motion-v2]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bamboo-character-motion-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Wire procedural fighter rig to motion controller
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/stage/src/BambooBattle3D.tsx')
          text = path.read_text()

          old = "import type { BambooBattleState, BambooTeam } from './bambooBattle';"
          new = old + "\nimport { applyFighterMotion, type FighterMotionRig } from './bambooMotion';"
          assert old in text and "./bambooMotion" not in text
          text = text.replace(old, new, 1)

          old = """  model.add(mesh(new THREE.SphereGeometry(.34, 18, 14), darkFur, [-.47, .32, .18], [1.2, .75, 1.4]));
  model.add(mesh(new THREE.SphereGeometry(.34, 18, 14), darkFur, [.47, .32, .18], [1.2, .75, 1.4]));"""
          new = """  const leftFoot = mesh(new THREE.SphereGeometry(.34, 18, 14), darkFur, [-.47, .32, .18], [1.2, .75, 1.4]);
  const rightFoot = mesh(new THREE.SphereGeometry(.34, 18, 14), darkFur, [.47, .32, .18], [1.2, .75, 1.4]);
  model.add(leftFoot, rightFoot);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  root.userData.model = model;
  root.userData.accent = accent;
  return root;"""
          new = """  root.userData.model = model;
  root.userData.accent = accent;
  root.userData.motion = { model, leftArm, rightArm, leftFoot, rightFoot } satisfies FighterMotionRig;
  return root;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """      const greenModel = greenBear.userData.model as THREE.Group;
      const orangeModel = orangeBear.userData.model as THREE.Group;
      greenModel.rotation.x = -.22 - Math.sin(elapsed * 5.2) * .025 - (impactTeam === 'green' ? impactPulse * .14 : -impactPulse * .035);
      orangeModel.rotation.x = -.22 - Math.sin(elapsed * 5.2 + 1.4) * .025 - (impactTeam === 'orange' ? impactPulse * .14 : -impactPulse * .035);
      greenModel.position.y = Math.sin(elapsed * 4.5) * .035;
      orangeModel.position.y = Math.sin(elapsed * 4.5 + 1.3) * .035;
"""
          new = """      const greenRig = greenBear.userData.motion as FighterMotionRig;
      const orangeRig = orangeBear.userData.motion as FighterMotionRig;
      applyFighterMotion(greenRig, {
        team: 'green', elapsed, impactPulse, impactTeam, impactAge, velocity, position: liveState.position,
        status: liveState.status, winner: liveState.winner, fallProgress,
        isFalling: fallingTeam === 'green',
      });
      applyFighterMotion(orangeRig, {
        team: 'orange', elapsed, impactPulse, impactTeam, impactAge, velocity, position: liveState.position,
        status: liveState.status, winner: liveState.winner, fallProgress,
        isFalling: fallingTeam === 'orange',
      });
"""
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install
        run: npm ci
      - name: Validate assets
        run: npm run assets:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: |
          npm run build -w @orbitstage/shared
          npm run build -w @orbitstage/runtime
          npm run build -w @orbitstage/live-service
          npm run build -w @orbitstage/control
          npm run build -w @orbitstage/stage
          npm run build -w @orbitstage/desktop
      - name: Unit and integration
        run: |
          npm test
          npm run test:integration
      - name: Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1
      - name: E2E
        env:
          CI: 'true'
        run: xvfb-run -a npx playwright test
      - name: Commit motion V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/stage/src/BambooBattle3D.tsx apps/stage/src/bambooMotion.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Improve Bamboo fighter motion state'
          git push origin HEAD:agent/bamboo-character-motion-v2
