name: Refactor architecture

on:
  push:
    branches:
      - agent/architecture-cleanup
    paths:
      - .github/workflows/refactor-architecture.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-cleanup

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Split runtime package from Electron shell
        run: |
          set -euo pipefail
          mkdir -p packages/runtime/src
          git mv apps/desktop/src/app-config.ts packages/runtime/src/app-config.ts
          git mv apps/desktop/src/app-config.test.ts packages/runtime/src/app-config.test.ts
          git mv apps/desktop/src/live-runtime.ts packages/runtime/src/live-runtime.ts
          git mv apps/desktop/src/live-runtime.test.ts packages/runtime/src/live-runtime.test.ts

          node <<'NODE'
          const fs = require('node:fs');

          const runtimePath = 'packages/runtime/src/live-runtime.ts';
          let runtime = fs.readFileSync(runtimePath, 'utf8');
          runtime = runtime.replace('import type { AppConfig } from "./app-config";', 'import type { AppConfig } from "./app-config.js";');
          runtime = runtime.replace('import type { StructuredLogger } from "./logger";\n', 'export interface RuntimeLogger {\n  info(event: string, data?: unknown): void;\n  warn(event: string, data?: unknown): void;\n  error(event: string, error: unknown, data?: unknown): void;\n}\n');
          runtime = runtime.replace('logger: StructuredLogger;', 'logger: RuntimeLogger;');
          fs.writeFileSync(runtimePath, runtime);

          const runtimeTestPath = 'packages/runtime/src/live-runtime.test.ts';
          let runtimeTest = fs.readFileSync(runtimeTestPath, 'utf8');
          runtimeTest = runtimeTest.replace(/from ["']\.\/app-config["']/g, 'from "./app-config.js"');
          runtimeTest = runtimeTest.replace(/import \{ StructuredLogger \} from ["']\.\/logger["'];\n/g, '');
          runtimeTest = runtimeTest.replace(/from ["']\.\/live-runtime["']/g, 'from "./live-runtime.js"');
          runtimeTest = runtimeTest.replace('logger: new StructuredLogger(dataDirectory)', 'logger: { info: () => undefined, warn: () => undefined, error: () => undefined }');
          fs.writeFileSync(runtimeTestPath, runtimeTest);

          const configTestPath = 'packages/runtime/src/app-config.test.ts';
          let configTest = fs.readFileSync(configTestPath, 'utf8');
          configTest = configTest.replace(/from ["']\.\/app-config["']/g, 'from "./app-config.js"');
          fs.writeFileSync(configTestPath, configTest);

          for (const file of fs.readdirSync('apps/desktop/src').filter((name) => name.endsWith('.ts'))) {
            const path = `apps/desktop/src/${file}`;
            let text = fs.readFileSync(path, 'utf8');
            text = text.replace(/from ["']\.\/app-config["']/g, 'from "@orbitstage/runtime"');
            text = text.replace(/from ["']\.\/live-runtime["']/g, 'from "@orbitstage/runtime"');
            fs.writeFileSync(path, text);
          }

          const desktopPkgPath = 'apps/desktop/package.json';
          const desktopPkg = JSON.parse(fs.readFileSync(desktopPkgPath, 'utf8'));
          desktopPkg.dependencies['@orbitstage/runtime'] = '1.0.0';
          desktopPkg.dependencies = Object.fromEntries(Object.entries(desktopPkg.dependencies).sort(([a], [b]) => a.localeCompare(b)));
          desktopPkg.scripts.typecheck = 'npm run build -w @orbitstage/runtime && tsc -p tsconfig.json --noEmit';
          fs.writeFileSync(desktopPkgPath, JSON.stringify(desktopPkg, null, 2) + '\n');

          const rootPkgPath = 'package.json';
          const rootPkg = JSON.parse(fs.readFileSync(rootPkgPath, 'utf8'));
          rootPkg.scripts.build = rootPkg.scripts.build.replace('npm run build -w @orbitstage/shared &&', 'npm run build -w @orbitstage/shared && npm run build -w @orbitstage/runtime &&');
          fs.writeFileSync(rootPkgPath, JSON.stringify(rootPkg, null, 2) + '\n');

          const ciPath = '.github/workflows/e2e.yml';
          let ci = fs.readFileSync(ciPath, 'utf8');
          ci = ci.replace('      - agent/stage-v2-productization', '      - agent/stage-v2-productization\n      - agent/architecture-cleanup');
          ci = ci.replace('          npm run build -w @orbitstage/shared\n', '          npm run build -w @orbitstage/shared\n          npm run build -w @orbitstage/runtime\n');
          fs.writeFileSync(ciPath, ci);
          NODE

          cat > packages/runtime/package.json <<'EOF'
          {
            "name": "@orbitstage/runtime",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "main": "./dist/index.js",
            "types": "./dist/index.d.ts",
            "exports": {
              ".": {
                "types": "./dist/index.d.ts",
                "import": "./dist/index.js",
                "require": "./dist/index.js"
              }
            },
            "files": ["dist"],
            "scripts": {
              "build": "tsc -p tsconfig.build.json",
              "typecheck": "tsc -p tsconfig.json --noEmit",
              "test": "vitest run"
            },
            "dependencies": {
              "ws": "8.21.3",
              "zod": "4.4.3"
            },
            "devDependencies": {
              "@types/node": "^24.10.0",
              "@types/ws": "8.18.1",
              "typescript": "7.0.2",
              "vitest": "4.1.10"
            }
          }
          EOF

          cat > packages/runtime/tsconfig.json <<'EOF'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["src/**/*.ts"],
            "exclude": ["dist", "node_modules", "**/*.test.ts"]
          }
          EOF

          cat > packages/runtime/tsconfig.build.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "paths": {},
              "noEmit": false,
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true,
              "composite": true,
              "rootDir": "src",
              "outDir": "dist"
            }
          }
          EOF

          cat > packages/runtime/src/index.ts <<'EOF'
          export * from './app-config.js';
          export * from './live-runtime.js';
          EOF

          cat > packages/runtime/README.md <<'EOF'
          # @orbitstage/runtime

          Runtime/domain layer shared by the Electron shell and tests.

          This package owns application configuration contracts and the live session runtime. It must not import Electron APIs. Platform-specific storage, windows, secrets, IPC, AI/TTS adapters and HTTP serving remain in `apps/desktop`.
          EOF

          npm install --package-lock-only --ignore-scripts
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate assets
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: |
          npm test
          npm run test:integration

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1

      - name: Electron E2E
        env:
          CI: 'true'
        run: xvfb-run -a npx playwright test

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor desktop runtime into package boundary"
          git push origin HEAD:agent/architecture-cleanup
