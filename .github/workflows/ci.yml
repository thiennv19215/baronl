name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build shared package for workspace tests
        run: npm run build -w @orbitstage/shared

      - name: Unit tests
        run: npm test

      - name: Asset registry audit
        run: npm run assets:check

      - name: Build shared
        run: npm run build -w @orbitstage/shared

      - name: Build live service
        run: npm run build -w @orbitstage/live-service

      - name: Build control
        run: npm run build -w @orbitstage/control

      - name: Build stage
        run: npm run build -w @orbitstage/stage

      - name: Build desktop
        run: npm run build -w @orbitstage/desktop

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and Electron E2E
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" npx playwright test

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ui-snapshots
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
