name: Bamboo camera patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply camera patch once
        run: |
          if grep -q "createBambooCameraDirector" apps/stage/src/BambooBattle3D.tsx; then exit 0; fi
          echo '' | base64 -d | python
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/stage/src/BambooBattle3D.tsx
          git commit -m "Use Bamboo camera director"
          git push
